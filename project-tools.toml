# Tools managed by `cargo project-tools`.

[settings]
# Run network commands through sfw (Socket Firewall Free): "auto", "require" or "off".
sfw = "auto"
# Target triples tools are reviewed, audited and installed for; remove to allow all.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# Revalidate the advisory database when it was last checked longer ago than this.
# advisory-db-max-age = "1d"

[build]
profile = "release"
# Build in an OS sandbox (no network, writes only to the build): "auto", "require" or "off".
# sandbox = "auto"

[build.sandbox-os]
# sandbox-exec ships with macOS, so never build there without it.
macos = "require"

[build.profile-settings]
strip = "symbols"
lto = "thin"
codegen-units = 1

[tool.cargo-nextest]
version = "0.9.152"
default-features = false

[tool.cargo-deny]
version = "0.22.0"

[tool.cross]
version = "0.2.5"
git = "https://github.com/cross-rs/cross"
rev = "49cd054de9b832dfc11a4895c72b0aef533b5c6a"
bins = ["cross"]
