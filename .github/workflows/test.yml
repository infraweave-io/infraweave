name: Test (Reusable)

on:
  workflow_call:
    secrets: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOCKER_IMAGE_MIRROR: ghcr.io/${{ github.repository }}
  CARGO_TERM_VERBOSE: true
  K8S_OPENAPI_ENABLED_VERSION: v1.31
  # Previously exported by dtolnay/rust-toolchain; set explicitly now that we install via rustup.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc -vV

      - name: Run fmt
        run: cargo fmt --check

      - name: Check Cargo.lock up to date
        if: ${{ !cancelled() }}
        id: check-cargo-lock
        run: cargo update --workspace --locked --quiet

      - name: Rust Cache
        if: ${{ !cancelled() && steps.check-cargo-lock.outcome == 'success' }}
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: "test"
          save-if: false

      - name: Run clippy
        if: ${{ !cancelled() && steps.check-cargo-lock.outcome == 'success' }}
        run: bash .github/scripts/lint_clippy-2-md.sh ALL

  build-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space
        with:
          level: "standard"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc -vV

      - name: Check Cargo.lock up to date
        run: cargo update --workspace --locked --quiet

      - name: Rust Cache
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: "test"
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Setup Socket Firewall
        uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'restore' }}

      - name: Install project tools (cargo-deny, cargo-nextest, cross)
        uses: osseco/setup-cargo-project-tools@853c6b7784f4309ea4a68701cdfcc87c7304d0fb # v5.6.0-0.4.0
        with:
          audit: true

      - name: Run cargo deny check advisories
        run: cargo deny check advisories --show-stats --hide-inclusion-graph

      - name: Run cargo deny check bans licenses sources
        run: cargo deny check bans licenses sources --show-stats --hide-inclusion-graph

      - name: Build nextest archive
        run: cargo nextest archive --archive-file nextest-archive.tar.zst --cargo-profile ci-tests --locked

      - name: Upload nextest archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst

  unit-tests:
    needs: build-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.11.4

      - name: Alias tofu as terraform
        run: sudo ln -sf $(which tofu) /usr/local/bin/terraform

      - name: Setup Socket Firewall
        uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'restore' }}

      - name: Install project tools (should exist in cache)
        uses: osseco/setup-cargo-project-tools@853c6b7784f4309ea4a68701cdfcc87c7304d0fb # v5.6.0-0.4.0

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      - name: Run unit tests
        run: >- 
          cargo nextest run --archive-file nextest-archive.tar.zst 
          -E "kind(lib) + kind(bin)"

  integration-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.set-matrix.outputs.tests }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create integration tests list
        id: set-matrix
        run: |
          cd integration-tests/tests
          tests=$(grep -l -E '#\[(tokio::)?test\]' *.rs 2>/dev/null | xargs -I{} basename {} .rs | awk 'BEGIN{printf "["} {if(NR>1)printf ","; printf "\"%s\"", $0} END{printf "]"}')
          echo "tests=$tests" >> $GITHUB_OUTPUT
          
          echo "Integration tests matrix:"
          echo "$tests" | jq '.'

  integration-test:
    name: ${{ matrix.provider.PROVIDER }} (${{ matrix.test }})
    needs: [build-tests, integration-tests-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - PROVIDER: aws
            INFRAWEAVE_ENV: dev
            INFRAWEAVE_API_FUNCTION: function
            AWS_ACCESS_KEY_ID: dummy
            AWS_SECRET_ACCESS_KEY: dummy
            AWS_REGION: us-east-1
            TEST_MODE: true
            CONCURRENCY_LIMIT: 1
          - PROVIDER: azure
            INFRAWEAVE_ENV: dev
            INFRAWEAVE_API_FUNCTION: function
            AZURE_CLIENT_ID: dummy
            AZURE_CLIENT_SECRET: dummy
            AZURE_TENANT_ID: dummy
            REGION: westus2
            TEST_MODE: true
            CONCURRENCY_LIMIT: 1
        test: ${{ fromJson(needs.integration-tests-matrix.outputs.tests) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.11.4

      - name: Alias tofu as terraform
        run: sudo ln -sf $(which tofu) /usr/local/bin/terraform

      - name: Docker Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Socket Firewall
        uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'restore' }}

      - name: Install project tools (should exist in cache)
        uses: osseco/setup-cargo-project-tools@853c6b7784f4309ea4a68701cdfcc87c7304d0fb # v5.6.0-0.4.0

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      - name: Run nextest
        run: |
          FILTER='package(integration-tests) & binary(${{ matrix.test }})'
          if ! cargo nextest list --archive-file nextest-archive.tar.zst -E "$FILTER" -- --include-ignored | grep -q "::"; then
            echo "No tests found matching filter: $FILTER"
            exit 1
          fi
          cargo nextest run --archive-file nextest-archive.tar.zst -E "$FILTER" -j 1 --no-tests=warn
        env: ${{ matrix.provider }}
