name: Build Binaries (Reusable)

on:
  workflow_call:
    secrets: {}
    inputs:
      version:
        required: true
        type: string
        description: Version of the CLI to build (e.g., 0.1.0)
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        description: Version of the CLI to build (e.g., 0.1.0)
        default: 0.0.0-manual
env:
  VERSION: ${{ inputs.version }}
  CARGO_TERM_VERBOSE: true
  # Previously exported by dtolnay/rust-toolchain; set explicitly now that we install via rustup.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  K8S_OPENAPI_ENABLED_VERSION: v1.31

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustc -vV

      - name: Check Cargo.lock up to date
        run: cargo update --workspace --locked --quiet

      - name: Validate targets
        env:
          TARGETS: ${{ vars.TARGETS }}
          BINARIES: ${{ vars.BINARIES }}
        run: .github/scripts/binaries_validate-targets.sh
        shell: bash
      
      - name: Setup build matrix
        id: set-matrix
        env:
          TARGETS: ${{ vars.TARGETS }}
          BINARIES: ${{ vars.BINARIES }}
        run: .github/scripts/binaries_setup-build-matrix.sh
        shell: bash

      
  build:
    name: Build (${{ matrix.name }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add "${{ matrix.rust_target }}"
          rustc -vV

      - name: Set version in Cargo.toml
        shell: bash
        run: |
          cargo update --workspace --locked --quiet
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          cargo update --workspace --offline
        
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: "deps-${{ matrix.rust_target }}"
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Setup Socket Firewall
        if: ${{ matrix.cross == true }}
        uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'true' || 'restore' }}

      - name: Install cross
        if: ${{ matrix.cross == true }}
        uses: osseco/setup-cargo-project-tools@853c6b7784f4309ea4a68701cdfcc87c7304d0fb # v5.6.0-0.4.0

      - name: Build with cross
        if: ${{ matrix.cross == true }}
        run: cross build --release --locked --target ${{ matrix.rust_target }} --bin ${{ join(matrix.bins, ' --bin ') }}

      - name: Build with cargo
        if: ${{ matrix.cross == false }}
        run: cargo build --release --locked --target ${{ matrix.rust_target }} --bin ${{ join(matrix.bins, ' --bin ') }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          for bin in ${{ join(matrix.bins, ' ') }}; do
            cp "target/${{ matrix.rust_target }}/release/$bin.exe" "release/$bin-${{ matrix.name }}.exe"
          done
          
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          for bin in ${{ join(matrix.bins, ' ') }}; do
            cp "target/${{ matrix.rust_target }}/release/$bin" "release/$bin-${{ matrix.name }}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: release/*
          retention-days: 2
