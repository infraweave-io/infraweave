name: Mirror Docker Images to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REPO: ${{ github.repository }}
  DOCKER_REGISTRY: docker.io

jobs:
  setup:
    name: Setup image mirror matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup image mirror matrix
        id: set-matrix
        env:
          DOCKER_IMAGE_MIRROR: ${{ vars.DOCKER_IMAGE_MIRROR }}
        run: .github/scripts/image_mirror_setup-matrix.sh
        shell: bash

  mirror:
    name: Mirror ${{ matrix.to }}
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Lowercase GHCR repo
        # GHCR rejects uppercase repository names
        run: echo "GHCR_REPO=${GHCR_REPO,,}" >> "$GITHUB_ENV"

      - name: Log into Docker Hub
        # Note: Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to avoid rate limits.
        # Public images can be pulled without credentials, but authenticated pulls have higher rate limits.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy image (amd64 + arm64) to GHCR
        # imagetools copies the manifest list registry-to-registry;
        # docker pull/push would only keep the runner's platform (amd64)
        run: |
          docker buildx imagetools create \
            --platform linux/amd64 \
            --platform linux/arm64 \
            --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPO }}/${{ matrix.to }} \
            ${{ matrix.from }}
