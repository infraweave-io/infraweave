name: Build and Release Binaries for CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PROJECT_NAME: cli
  VERSION: ${{ github.ref_name }}
  # Previously exported by dtolnay/rust-toolchain; set explicitly now that we install via rustup.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: macos-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc -vV

      - name: Setup Cache for Cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked

      - name: Build with cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build -p ${{ env.PROJECT_NAME }} --verbose --locked --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p ${{ env.PROJECT_NAME }} --verbose --locked --release --target ${{ matrix.target }}

      - name: Prepare Binary for Release
        shell: bash
        run: |
          BIN_SUFFIX=""
          if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
            BIN_SUFFIX=".exe"
          fi

          BIN_OUTPUT="target/${{ matrix.target }}/release/${PROJECT_NAME}${BIN_SUFFIX}"
          BIN_RELEASE="cli-${{ matrix.name }}${BIN_SUFFIX}"
          BIN_RELEASE_VERSIONED="cli-${{ matrix.name }}-${VERSION}${BIN_SUFFIX}"

          mkdir -p "./cli-releases"

          if [[ -f "$BIN_OUTPUT" ]]; then
            # Keep the raw binary for backward compatibility
            cp "$BIN_OUTPUT" "./cli-releases/$BIN_RELEASE"
            
            # Also create versioned binary for archive
            cp "$BIN_OUTPUT" "./cli-releases/$BIN_RELEASE_VERSIONED"
            
            # Create archives based on platform
            if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
              # Create ZIP for Windows
              cd "./cli-releases"
              7z a -tzip "$BIN_RELEASE.zip" "$BIN_RELEASE_VERSIONED"
              rm "$BIN_RELEASE_VERSIONED"
            else
              # Create tar.gz for Unix-like systems (Linux/macOS)
              cd "./cli-releases"
              tar -czf "$BIN_RELEASE.tar.gz" "$BIN_RELEASE_VERSIONED"
              rm "$BIN_RELEASE_VERSIONED"
            fi
          else
            echo "Error: Built binary not found at $BIN_OUTPUT" && exit 1
          fi

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: ./cli-releases/cli-${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./cli-releases

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: ./cli-releases/** # Upload all binaries as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
